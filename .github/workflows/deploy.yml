# Production deploy: build the static site and upload it to Namecheap over FTPS.
#
# Previews: Vercel builds every branch from the same static export (no setup in
# this file: connect the GitHub repo in Vercel). This workflow only handles the
# live site, and only once SITE_LIVE is "true" (launch day).
#
# Set these in GitHub → Settings → Secrets and variables → Actions:
#   secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   (cPanel → FTP Accounts)
#   variables: FTP_PRODUCTION_DIR  e.g. public_html/
#              SITE_LIVE           "true" on launch day
#
# Sanity triggers a rebuild on publish via a webhook that calls
# POST /repos/<owner>/<repo>/dispatches with {"event_type": "sanity-publish"}.

name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SITE_LIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Upload to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.FTP_PRODUCTION_DIR }}
